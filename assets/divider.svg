<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="14" viewBox="0 0 1600 14" preserveAspectRatio="none" role="img" aria-label="divider">
  <defs>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#071009"/>
      <stop offset="0.5" stop-color="#17773B"/>
      <stop offset="1" stop-color="#071009"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3DFD7D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3DFD7D" stop-opacity="1"/>
      <stop offset="1" stop-color="#3DFD7D" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>
  <rect x="0" y="6" width="1600" height="2" fill="url(#line)"/>
  <g>
    <rect x="-460" y="3" width="460" height="8" fill="url(#pulse)" filter="url(#soft)" opacity="0.6"/>
    <rect x="-460" y="6" width="460" height="2" fill="url(#pulse)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;2060 0" keyTimes="0;1" calcMode="spline" keySplines="0.45 0 0.55 1" dur="3.4s" repeatCount="indefinite"/>
  </g>
</svg>
